name: frontend

on:
  push:
    paths: ['packages/ui-core/**', 'apps/pwa/**', 'services/**', 'packages/server-core/**',
            'api/**', 'scripts/build.mjs', 'package.json', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['packages/ui-core/**', 'apps/pwa/**', 'services/**', 'packages/server-core/**',
            'api/**', 'scripts/build.mjs', 'package.json', '.github/workflows/frontend.yml']

jobs:
  test:
    name: ui-core · pwa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: ui-core
        run: cd packages/ui-core && npm install --no-audit --no-fund && npm test

      - name: pwa
        run: cd apps/pwa && npm install --no-audit --no-fund && npm test

      # Node's type-stripping cannot compile parameter properties, and the
      # failure is a confusing runtime SyntaxError rather than a type error.
      - name: Guard against TS parameter properties
        run: |
          if grep -rnE 'constructor\([^)]*(private|public|protected|readonly) ' \
               --include='*.ts' packages apps services | grep -v node_modules; then
            echo "::error::TypeScript parameter properties are unsupported by node's type-stripping"
            exit 1
          fi
          echo "none found"

      # Decision D11 (docs/11-MASTER-PLAN.md): shikhonBD is the PERMANENT
      # platform and marketing brand. White-labelling applies to a tenant's
      # operational application and the documents it produces — not to the
      # platform's own website.
      #
      # So this guard runs in BOTH directions, because both failures are
      # real and they pull opposite ways:
      #
      #   1. Platform brand leaking INTO a school's operational screens —
      #      the R-1 regression. Erodes one reasonable string at a time: a
      #      placeholder here, a footer there.
      #
      #   2. Platform brand being stripped OUT of the marketing site — the
      #      likelier mistake now that a guard exists at all, because
      #      "remove ShikhonBD" reads like a rule that applies everywhere.
      #      It does not. index.html is our own shopfront.
      #
      # Since R-1-A the three surfaces have three files, and which list a
      # file belongs to follows from which surface it serves:
      #   index.html   →  "/"        marketing        PLATFORM-branded
      #   app.html     →  "/app"     the application  tenant-branded
      #   design.html  →  "/design"  the prototype    tenant-branded
      #                              (it mimics tenant screens, so it must
      #                               not teach anyone the platform's brand
      #                               belongs on them)
      - name: Brand boundary (D11)
        run: |
          set -euo pipefail

          # ── Tenant-brand-required surfaces ──────────────────────────
          # A school's login, shell, PWA identity, offline page and the
          # documents it prints. Comment lines are excluded: explaining the
          # rule is not breaking it.
          hits=$(grep -rn 'ShikhonBD' \
                   apps/pwa/src apps/pwa/public/app.html \
                   apps/pwa/public/design.html apps/pwa/public/offline.html \
                   apps/pwa/public/manifest.webmanifest \
                 | grep -vE '^\s*[^:]+:[0-9]+:\s*(//|\*|<!--)' || true)
          if [ -n "$hits" ]; then
            echo "::error::platform brand found in a TENANT-facing surface (D11)"
            echo "$hits"
            exit 1
          fi
          echo "ok  tenant surfaces carry no platform brand"

          # ── Platform-brand-required surfaces ────────────────────────
          # The marketing site must keep saying who we are. A white-label
          # sweep that reached this file would silently un-brand the
          # company's own website, and nothing else would notice.
          for f in apps/pwa/public/index.html; do
            if ! grep -qi 'shikhonbd' "$f"; then
              echo "::error file=$f::platform brand missing from a PLATFORM surface (D11) — index.html is shikhonBD's own marketing site and must stay branded"
              exit 1
            fi
            echo "ok  $f carries the platform brand"
          done

      # The critical path is budgeted at 180 KB gzipped (docs/01 §8).
      #
      # This used to weigh the raw hand-written sources against a 30 KB
      # proxy limit. That gate stopped being meaningful once the PWA grew
      # past a handful of views — it had been failing on every push for
      # weeks, which is worse than having no gate, because a permanently
      # red check is one nobody reads.
      #
      # It now measures the thing the budget is actually about: the bundle
      # a student on a 2G connection downloads, gzipped, against the real
      # documented number. Comments and whitespace no longer count against
      # a budget they never cost the user.
      # The api/ bundles are committed (see .gitignore for why Vercel needs
      # them in the clone). Committed generated files rot silently, so this
      # rebuilds and fails if what is in git is not what the sources produce.
      # esbuild is pinned exactly in package.json to keep this reproducible.
      - name: Committed API bundles match the sources
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          if ! git diff --exit-code --stat -- api/; then
            echo "::error::api/ bundles are stale — run 'npm run build' and commit the result"
            exit 1
          fi
          echo "api/ bundles are current"

      - name: Critical-path size budget
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          bytes=$(gzip -9 -c apps/pwa/public/app.js | wc -c | tr -d ' ')
          limit=184320   # 180 KB
          printf 'app.js: %s bytes gzipped (budget %s)\n' "$bytes" "$limit"
          if [ "$bytes" -gt "$limit" ]; then
            echo "::error::critical path exceeded 180 KB gzipped"
            exit 1
          fi
