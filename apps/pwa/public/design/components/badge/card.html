<!-- @dsCard group="Components" viewport="700x140" subtitle="Status pills — color + word, never color alone" name="Badges" -->
<link rel="stylesheet" href="../../styles.css">
<div style="padding:24px;display:flex;gap:10px;flex-wrap:wrap;font-family:var(--font-bn)">
  <span style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--radius-pill);background:var(--color-success-soft);color:var(--color-success-ink);font-size:12px;font-weight:600">✓ উপস্থিত</span>
  <span style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--radius-pill);background:var(--color-danger-soft);color:var(--color-danger-ink);font-size:12px;font-weight:600">✕ অনুপস্থিত</span>
  <span style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--radius-pill);background:var(--color-warning-soft);color:var(--color-warning-ink);font-size:12px;font-weight:600">⏱ বিলম্বিত</span>
  <span style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--radius-pill);background:var(--color-info-soft);color:var(--color-info-ink);font-size:12px;font-weight:600">তথ্য</span>
  <span style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--radius-pill);background:var(--color-accent-2-soft);color:var(--color-accent-2-ink);font-size:12px;font-weight:600">পরীক্ষা</span>
  <span style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--radius-pill);background:var(--color-surface-muted);color:var(--color-text-muted);font-size:12px;font-weight:600">সাধারণ</span>
</div>
