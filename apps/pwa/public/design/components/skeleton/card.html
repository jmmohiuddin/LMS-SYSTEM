<!-- @dsCard group="Components" viewport="700x140" subtitle="Shimmer placeholder — no heavy loading libs" name="Skeleton" -->
<link rel="stylesheet" href="../../styles.css">
<style>@keyframes ds-skeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}</style>
<div style="padding:24px;display:flex;flex-direction:column;gap:10px">
  <div style="width:180px;height:18px;border-radius:6px;background:linear-gradient(90deg,var(--color-surface-muted) 25%,var(--color-border) 50%,var(--color-surface-muted) 75%);background-size:200% 100%;animation:ds-skeleton 1.4s ease-in-out infinite"></div>
  <div style="width:280px;height:14px;border-radius:6px;background:linear-gradient(90deg,var(--color-surface-muted) 25%,var(--color-border) 50%,var(--color-surface-muted) 75%);background-size:200% 100%;animation:ds-skeleton 1.4s ease-in-out infinite"></div>
  <div style="width:220px;height:14px;border-radius:6px;background:linear-gradient(90deg,var(--color-surface-muted) 25%,var(--color-border) 50%,var(--color-surface-muted) 75%);background-size:200% 100%;animation:ds-skeleton 1.4s ease-in-out infinite"></div>
</div>
