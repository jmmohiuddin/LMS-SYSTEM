<!-- @dsCard group="Colors" viewport="700x160" subtitle="Ground, surface, border, text" name="Neutrals" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;font-family:var(--font-en);background:var(--color-bg)}
  .row{display:flex;gap:12px}
  .sw{width:100px}
  .chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--color-border)}
  .lbl{font-size:11px;color:var(--color-text-muted);margin-top:6px}
  .hex{font-size:11px;color:var(--color-text);font-weight:600}
</style>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--color-bg)"></div><div class="lbl">Background</div><div class="hex">#ffffff</div></div>
  <div class="sw"><div class="chip" style="background:var(--color-surface)"></div><div class="lbl">Surface</div><div class="hex">#f9fafb</div></div>
  <div class="sw"><div class="chip" style="background:var(--color-surface-muted)"></div><div class="lbl">Surface muted</div><div class="hex">#f1f5f9</div></div>
  <div class="sw"><div class="chip" style="background:var(--color-border)"></div><div class="lbl">Border</div><div class="hex">#e5e7eb</div></div>
  <div class="sw"><div class="chip" style="background:var(--color-text)"></div><div class="lbl">Text</div><div class="hex">#1f2937</div></div>
  <div class="sw"><div class="chip" style="background:var(--color-text-muted)"></div><div class="lbl">Muted text</div><div class="hex">#6b7280</div></div>
</div>
