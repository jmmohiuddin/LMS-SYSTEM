<!-- @dsCard group="Colors" viewport="700x210" subtitle="Brand + semantic status colors" name="Brand & status" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;font-family:var(--font-en);background:var(--color-bg)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{width:96px}
  .chip{height:56px;border-radius:var(--radius-md);box-shadow:var(--shadow-sm)}
  .lbl{font-size:11px;color:var(--color-text-muted);margin-top:6px}
  .hex{font-size:11px;color:var(--color-text);font-weight:600}
</style>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--color-primary)"></div><div class="lbl">Primary</div><div class="hex">#e53935</div></div>
  <div class="sw"><div class="chip" style="background:var(--color-success)"></div><div class="lbl">Success</div><div class="hex">#22c55e</div></div>
  <div class="sw"><div class="chip" style="background:var(--color-info)"></div><div class="lbl">Info</div><div class="hex">#3b82f6</div></div>
  <div class="sw"><div class="chip" style="background:var(--color-warning)"></div><div class="lbl">Warning</div><div class="hex">#f59e0b</div></div>
  <div class="sw"><div class="chip" style="background:var(--color-danger)"></div><div class="lbl">Danger</div><div class="hex">#dc2626</div></div>
  <div class="sw"><div class="chip" style="background:var(--color-accent-2)"></div><div class="lbl">Accent (sparing)</div><div class="hex">#8b5cf6</div></div>
</div>
