<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#006A4E">
  <title>শিখন — হাজিরা</title>

  <!-- The Bangla subset decides perceived load time on 2G; preload it. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="/fonts/noto-bengali-subset.woff2">
  <link rel="stylesheet" href="/app.css">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
  <!-- The shell renders before any data arrives, so a cold offline start
       shows a working screen rather than an error page. -->
  <main id="root" lang="bn">
    <p class="att-sub" style="padding:var(--s-4)">লোড হচ্ছে…</p>
  </main>

  <script type="module" src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
