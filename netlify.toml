# Netlify deployment. The Vercel config (vercel.json) is unchanged and both
# hosts build from the same sources — scripts/build.mjs emits the PWA once
# and then two sets of function bundles, one per platform, from the same
# service handlers. Nothing in apps/pwa knows which host it is running on.

[build]
  command = "npm run build"
  publish = "apps/pwa/public"
  functions = "netlify/functions"

[build.environment]
  # The build only runs esbuild; the handlers themselves target node22.
  NODE_VERSION = "22"

# Routes are declared per-function via `export const config = { path }` in
# the generated bundles (Netlify Functions v2), so there is no redirect
# table here to drift out of sync with scripts/build.mjs. The paths are
# byte-identical to the Vercel ones.

# Schedules are declared in code, on DEDICATED cron-* functions, not here.
# Netlify makes a scheduled function internal-only: attaching a schedule to
# the ops function returned 403 to the PWA's product-event ingest, which
# shares that dispatcher. See SCHEDULED_ENTRIES in scripts/build.mjs.

# Three surfaces, three addresses (R-1-A, master plan §1a):
#
#   /        the shikhonBD marketing site        index.html
#   /app     the tenant management application   app.html
#   /design  the Ata Ekta prototype              design.html
#
# Order matters — first match wins, and /api/v1/* is claimed earlier by the
# functions' own `export const config = { path }`.
#
# The application is a HASH router, so /app#/routine needs no server route of
# its own; /app/* is here only so a stray path segment still lands on the app
# rather than on the marketing page.
[[redirects]]
  from = "/offline"
  to = "/offline.html"
  status = 200

# R-7. The shikhonBD operator console. A separate page and a separate bundle
# from /app: this is the platform's own surface and keeps the platform brand
# (D11), while everything under /app is white-labelled to the school.
[[redirects]]
  from = "/platform"
  to = "/platform.html"
  status = 200

[[redirects]]
  from = "/platform/*"
  to = "/platform.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/design"
  to = "/design.html"
  status = 200

# Everything else is the marketing site. This used to send every unmatched
# path to the application, which is how the application came to own "/" —
# see docs/PHASE_LOG.md R-1-A.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served from cache, or a deploy ships new
# assets to a client that keeps asking the old worker for them. This is the
# CSS-cache-busting problem that bit us locally, made explicit at the edge.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/design.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed assets are safe to cache hard; app.js and app.css are not hashed,
# so they get revalidation rather than a long max-age.
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
